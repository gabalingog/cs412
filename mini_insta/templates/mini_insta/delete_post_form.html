{% extends 'mini_insta/base.html' %}

{% block header %}
<h1>Delete post for @{{profile.username}}</h1>
{% endblock %}

{% block content %}
<div class="main">
    <form method="POST">
        {% csrf_token %}
        <input type="submit" value="Delete Post">
    </form>

    <form action="{% url 'show_profile' profile.pk %}" method="GET">
        <input type="submit" value="Cancel">
    </form>

    <div class="single-post">
        {% for post in post.get_all_photos %}
            <img src="{{post.get_image_url}}" alt="Photo">
        {% endfor %}
        <p><strong>@{{profile.username}}</strong> {{post.caption}}</p>
        <p>{{post.timestamp}}</p>
    </div>
</div>
{% endblock %}
