{% extends 'mini_insta/base.html' %}

{% block header %}
<h1>Update post for @{{profile.username}}</h1>
{% endblock %}

{% block content %}
<div class="main">
    <form method="POST">
        {% csrf_token %}
        <table>{{form.as_table}}</table>
        <input type="submit" name="submit" value="Submit">
    </form>

    <form action="{% url 'show_post' post.pk %}" method="GET">
        <input type="submit" value="Cancel">
    </form>
</div>

{% endblock %}
