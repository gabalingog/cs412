{% extends 'mini_insta/base.html' %}

{% block header %}
<h1>@{{profile.username}} follows:</h1>
{% endblock %}

{% block content %}
<div class="main">
    <h2>{{profile.get_num_followers}} users</h2>
    <div class="inside">
        {% for follower in profile.get_followers %}
            <a href="{% url 'show_profile' follower.pk}">
                <img src="{{follower.profile_image_url}}" alt="Photo">
            </a>
        {% empty %}
        <p>No followers</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
