{% extends 'mini_insta/base.html' %}

{% block header %}
<h1>@{{profile.username}} follows:</h1>
{% endblock %}

{% block content %}
<div class="main">
    <h2>{{profile.get_num_following}} users</h2>
    <div class="inside">
        {% for follow in profile.get_following %}
            <a href="{% url 'show_profile' follow.pk}">
                <img src="{{follow.profile_image_url}}" alt="Photo">
            </a>
        {% empty %}
        <p>No following</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
