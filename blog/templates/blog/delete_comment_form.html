{% extends 'blog/base.html' %}
{% block content %}

<div>
    <h3>
        Are you sure you want to delete this comment?
    </h3>
    <p>{{comment}}</p>
</div>

<form method="POST">
    {% csrf_token %}
    <input type="submit" value="Delete">
</form>

<form action="{% url 'article' comment.article.pk %}" method="GET">
    {% csrf_token %}
    <input type="submit" value="Cancel">
</form>

{% endblock %}
