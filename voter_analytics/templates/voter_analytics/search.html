<h2>Filter Voters</h2>

<form action="{% url 'voters' %}">
    <table>
        <tr>
            <th>Party:</th>
            <td>
                <select name="party">
                    <option value="">Any</option>
                    {% for p in parties %}
                    <option value="{{p}}" 
                    {% if p == sel_party %}
                    selected
                    {% endif %}>{{p}}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <th>Born after (year):</th>
            <td>
                <select name="min_year">
                    <option value="">Any</option>
                    {% for y in years %}
                    <option value="{{y}}"
                    {% if y|stringformat:"s" == sel_min_year %}
                    selected
                    {% endif %}>{{y}}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <th>Born before (year):</th>
            <td>
                <select name="max_year">
                    <option value="">Any</option>
                    {% for y in years %}
                    <option value="{{y}}" 
                    {% if y|stringformat:"s" == sel_max_year %}
                    selected
                    {% endif %}>{{y}}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <th>Voter score:</th>
            <td>
                <select name="voter_score">
                    <option value="">Any</option>
                    {% for s in scores %}
                    <option value="{{s}}" 
                    {% if s|stringformat:"s" == sel_score %}
                    selected
                    {% endif %}>{{s}}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <th>Voted in:</th>
            <td>
                <input type="checkbox" name="v20state" {% if 'v20state' in request.GET %}checked{% endif %}> 2020 State
                <input type="checkbox" name="v21town" {% if 'v21town' in request.GET %}checked{% endif %}> 2021 Town
                <input type="checkbox" name="v21primary" {% if 'v21primary' in request.GET %}checked{% endif %}> 2021 Primary
                <input type="checkbox" name="v22general" {% if 'v22general' in request.GET %}checked{% endif %}> 2022 General
                <input type="checkbox" name="v23town" {% if 'v23town' in request.GET %}checked{% endif %}> 2023 Town
            </td>
        </tr>
        <tr>
            <td><input type="submit" value="Filter"></td>
            <td></td>
        </tr>
    </table>
</form>
